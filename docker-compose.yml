services:
  db:
    image: mysql:8.4
    container_name: myapp_db
    networks:
      - projectex_network
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=approotpass
      - MYSQL_DATABASE=myapp
      - MYSQL_USER=myapp
      - MYSQL_PASSWORD=myapppass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-papprootpass"]
      interval: 5s
      timeout: 5s
      start_period: 10s
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    networks:
      - projectex_network
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

networks:
  projectex_network:
    driver: bridge
    
volumes:
  mysql_data:
